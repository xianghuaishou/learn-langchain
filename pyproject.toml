[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-lang-chain"
version = "0.1.0"
description = "LangChain learning examples with MiniMax-M3"
requires-python = ">=3.10,<3.14"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]