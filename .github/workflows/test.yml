name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt
          uv pip install -e .

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v \
            --cov=learn_lang_chain \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-junit.xml \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload pytest junit report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: test-report-${{ matrix.python-version }}
          path: pytest-junit.xml

      - name: Post test results to PR
        if: github.event_name == 'pull_request'
        uses: dorny/test-reporter@v3
        with:
          name: pytest (Python ${{ matrix.python-version }})
          path: pytest-junit.xml
          reporter: python-xunit
          fail-on-error: false

      - name: Upload coverage to Codecov (optional)
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov (optional)
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          files: ./pytest-junit.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}